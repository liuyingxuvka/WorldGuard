contract_id: grab
claim:
  claim_id: grab
  text: At 18:00 Tom grabs the key that Lena still holds, while Lena waves.
  requested_semantics: [event]
  asserts:
    - {holds: tom_has_key, at: "18:00"}
world_model:
  model_id: grab
  relations:
    lena_has_key: {holds: [Lena, key]}
    tom_has_key: {holds: [Tom, key]}
    lena_on_mainland: {at: [Lena, mainland]}
    tom_on_mainland: {at: [Tom, mainland]}
inputs:
  event_model: {initial_states: [lena_has_key, lena_on_mainland, tom_on_mainland]}
  events:
    - {event_id: e_grab, at: "18:00", actor: Tom, place: mainland, uses: [], initiates: [tom_has_key]}
    - {event_id: e_wave, at: "18:00", actor: Lena, place: mainland, uses: [], initiates: [lena_waved]}
