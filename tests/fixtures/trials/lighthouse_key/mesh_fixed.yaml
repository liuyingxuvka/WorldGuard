    contract:
      claim:
        claim_id: door_opened_after_handover
        asserts:
          - {node: ch2, holds: door_unlocked, at: "21:00"}
  - {model_id: ch1, contract: ch1_fixed.yaml, source: chapter 1}
  - {model_id: ch2, contract: ch2_fixed.yaml, source: chapter 2}
