contract_id: ch2
claim:
  claim_id: ch2_door_opened
  text: Lena hands the key to Tom; the lighthouse door is opened at 21:00.
  requested_semantics:
  - event
  asserts:
  - event: e_give_key
    before: e_unlock
  - holds: DoorUnlocked
    at: '21:00'
world_model:
  model_id: ch2
  scope_limits:
  - chapter 2 only
inputs:
  event_model:
    initial_states:
    - LenaOnMainland
    - LenaHasKey
    - DoorLocked
    - TomOnMainland
  events:
  - event_id: e_give_key
    at: '18:00'
    source: ch2 p1
    actor: Lena
    with:
    - Tom
    requires:
    - LenaHasKey
    - LenaOnMainland
    - TomOnMainland
    initiates:
    - TomHasKey
    terminates:
    - LenaHasKey
  - event_id: e_tom_ferry
    at: '20:00'
    source: ch2 p2
    actor: Tom
    requires:
    - TomOnMainland
    initiates:
    - TomOnIsland
    terminates:
    - TomOnMainland
  - event_id: e_unlock
    at: '21:00'
    source: ch2 p3
    actor: Lena
    requires:
    - DoorLocked
    initiates:
    - DoorUnlocked
    terminates:
    - DoorLocked
