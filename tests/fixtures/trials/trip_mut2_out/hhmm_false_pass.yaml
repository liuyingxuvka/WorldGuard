contract_id: trip-hallstatt-001
claim:
  claim_id: c_trip
  text: Take the 07:55 train to Salzburg, the 10:30 bus to Hallstatt, sleep at the
    lake hotel, and return on the 14:10 boat and 15:00 bus to catch the 17:12 train.
  requested_semantics:
  - event
  asserts:
  - event: d1_train_arr
    before: d1_bus_out
world_model:
  model_id: hallstatt-trip
  model_version: v1
  scope_limits:
  - published timetables
  - no delays
inputs:
  event_model:
    initial_states:
    - in_munich
    - room_booked
  events:
  - event_id: d1_train_out
    at: '8:00'
    requires:
    - in_munich
    initiates: on_train
    terminates: in_munich
  - event_id: d1_train_arr
    at: '10:20'
    requires:
    - on_train
    initiates: in_salzburg
    terminates: on_train
  - event_id: d1_bus_out
    at: '9:40'
    requires:
    - in_salzburg
    initiates: on_bus
    terminates: in_salzburg
  - event_id: d1_bus_arr
    at: '11:40'
    requires:
    - on_bus
    initiates: in_hallstatt
    terminates: on_bus
  resources:
    places:
      munich:
      - color: traveler
        qty: 1
      train: []
      salzburg: []
      bus: []
      hallstatt: []
      boat: []
      station: []
    capacities:
      boat: 1
    transitions:
    - id: d1_train_out
      consumes:
      - place: munich
        color: traveler
        qty: 1
      produces:
      - place: train
        color: traveler
        qty: 1
      event: d1_train_out
    - id: d1_train_arr
      consumes:
      - place: train
        color: traveler
        qty: 1
      produces:
      - place: salzburg
        color: traveler
        qty: 1
      event: d1_train_arr
    - id: d1_bus_out
      consumes:
      - place: salzburg
        color: traveler
        qty: 1
      produces:
      - place: bus
        color: traveler
        qty: 1
      event: d1_bus_out
    - id: d1_bus_arr
      consumes:
      - place: bus
        color: traveler
        qty: 1
      produces:
      - place: hallstatt
        color: traveler
        qty: 1
      event: d1_bus_arr
    - id: d2_boat
      consumes:
      - place: hallstatt
        color: traveler
        qty: 1
      produces:
      - place: boat
        color: traveler
        qty: 1
    - id: d2_boat_arr
      consumes:
      - place: boat
        color: traveler
        qty: 1
      produces:
      - place: station
        color: traveler
        qty: 1
    - id: d2_bus_back
      consumes:
      - place: station
        color: traveler
        qty: 1
      produces:
      - place: bus
        color: traveler
        qty: 1
    - id: d2_bus_back_arr
      consumes:
      - place: bus
        color: traveler
        qty: 1
      produces:
      - place: salzburg
        color: traveler
        qty: 1
    - id: d2_train_home
      consumes:
      - place: salzburg
        color: traveler
        qty: 1
      produces:
      - place: munich
        color: traveler
        qty: 1
  causal_model:
    variables:
    - train_arr_h
    - bus_out_h
    - transfer_out_h
    - bus_back_arr_h
    - train_home_h
    - transfer_back_h
    equations:
      train_arr_h: '9.4167'
      bus_out_h: '10.5'
      transfer_out_h: bus_out_h - train_arr_h
      bus_back_arr_h: '16.75'
      train_home_h: '17.2'
      transfer_back_h: train_home_h - bus_back_arr_h
    scenarios:
      timetable: {}
    constraints:
    - transfer_out_h >= 0.25
    - transfer_back_h >= 0.25
  norms:
  - modality: permitted
    actor: traveler
    action: take_boat
    condition:
      fact_id: lake_calm
      value: true
  - modality: forbidden
    actor: traveler
    action: take_boat
    condition:
      fact_id: storm_warning
      value: true
  facts:
  - fact_id: lake_calm
    value: true
  - fact_id: storm_warning
    value: false
