interface:
  display_name: "WorldGuard"
  short_description: "World models, meshes, and hierarchical blueprints"
  default_prompt: "Use $worldguard as the sole entry. Preserve request source spans and supply one current task_shape. For unit, mesh, or task-local work, pass the current claim to worldguard.contracts.derive_guard_requirements and consume its canonical Guard denominator and fingerprint; never recalculate Guard selection from prompt-route metadata. For world_blueprint, select exactly one in-memory create, update, check, impact, or trace operation and require its exact target/blueprint identity; load only explicit affected Guard material. Keep native_domain_qualified separate from object_dna_qualified: object DNA additionally needs an independently derived census source, a valid signed exact census with a current discovery receipt bound to the frozen raw request and target, integrated_target claim kind, exact coverage, real external-test execution, semantically aligned current evidence, and caller trust in the census authority or producer. Producer trust never excuses a missing or mismatched per-revision discovery receipt. Without every gate, report the model as useful/native-qualified at most. Treat the seven-Guard matrix as an oracle-carrying capability fixture, not an integrated object. No target-object export, bundle, materialization, copied directory, or standalone package route exists; compose and validate the model in memory under its native directory. Read entry-routing.md plus only the selected references. Preserve exact native terminals and never use a child skill, caller subset, keyword score, understanding level, alias, retry, or fallback as authority."
