mesh_id: two_chapters
nodes:
- model_id: story
  contract:
    claim:
      claim_id: the_door_opens
      text: Chapter 2 ends with the door open; the chapter handoff checks that the key reached Mara first.
      asserts:
      - node: chapter2
        holds: door_open
        at: t2
- model_id: chapter1
  contract:
    contract_id: key_handoff
    world_model:
      relations:
        key_with_iris: {holds: [Iris, key]}
        key_with_mara: {holds: [Mara, key]}
        iris_in_hall: {at: [Iris, hall]}
        mara_in_hall: {at: [Mara, hall]}
    claim:
      claim_id: mara_has_key
      asserts:
      - holds: key_with_mara
        at: t1
    inputs:
      event_model:
        initial_states:
        - key_with_iris
        - door_locked
        - iris_in_hall
        - mara_in_hall
      events:
      - event_id: hand_over_key
        at: t1
        actor: Iris
        with: [Mara]
        place: hall
        uses: [key]
        requires:
        - key_with_iris
        initiates:
        - key_with_mara
        terminates:
        - key_with_iris
- model_id: chapter2
  contract:
    contract_id: unlock_door
    world_model:
      relations:
        key_with_iris: {holds: [Iris, key]}
        key_with_mara: {holds: [Mara, key]}
        mara_in_hall: {at: [Mara, hall]}
    claim:
      claim_id: door_is_open
      asserts:
      - holds: door_open
        at: t2
    inputs:
      event_model:
        initial_states:
        - key_with_mara
        - door_locked
        - mara_in_hall
      events:
      - event_id: unlock
        at: t2
        actor: Mara
        place: hall
        uses: [key]
        requires:
        - key_with_mara
        - door_locked
        initiates:
        - door_open
        terminates:
        - door_locked
edges:
- edge_id: story_chapter1
  relation: parent_child
  from: story
  to: chapter1
- edge_id: story_chapter2
  relation: parent_child
  from: story
  to: chapter2
- edge_id: next_chapter
  relation: continues
  from: chapter1
  to: chapter2
variants:
- id: forgotten_key_handoff
  expect: FAIL
  code: MESH_HANDOFF_STATE_MISMATCH
  set:
    nodes[chapter2].contract.inputs.event_model.initial_states: [key_with_iris, door_locked]
