[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldguard"
version = "0.9.0"
description = "Model-first guard framework for auditable world-claim checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "flowguard @ git+https://github.com/liuyingxuvka/FlowGuard.git@1f7ce7b579308f4701c60117296fb24a3bfd9c8e",
]

[project.urls]
Homepage = "https://github.com/liuyingxuvka/worldguard"
Repository = "https://github.com/liuyingxuvka/worldguard"
Issues = "https://github.com/liuyingxuvka/worldguard/issues"

[project.scripts]
worldguard = "worldguard.cli:main"

[tool.setuptools.packages.find]
include = ["worldguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
