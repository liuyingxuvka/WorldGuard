[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldguard"
version = "0.10.1"
description = "Model-first guard framework for auditable world-claim checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
units = [
    "physicsguard @ git+https://github.com/liuyingxuvka/PhysicsGuard.git@v0.18.0",
]
test = [
    "pytest>=8.0",
    "flowguard @ git+https://github.com/liuyingxuvka/FlowGuard.git@v2.0.0",
    "physicsguard @ git+https://github.com/liuyingxuvka/PhysicsGuard.git@v0.18.0",
]

[project.urls]
Homepage = "https://github.com/liuyingxuvka/worldguard"
Repository = "https://github.com/liuyingxuvka/worldguard"
Issues = "https://github.com/liuyingxuvka/worldguard/issues"

[project.scripts]
worldguard = "worldguard.cli:main"

[tool.setuptools.packages.find]
include = ["worldguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p flowguard.intent.plugin"

[tool.flowguard]
authority_docs = ["AGENTS.md"]
skip_policy = "forbid"
